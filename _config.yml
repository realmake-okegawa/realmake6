# ============================================================
#  Real Make - Jekyll 設定ファイル
#  ------------------------------------------------------------
#  現在は独自ドメインなしで GitHub Pages に公開する設定です。
#  （2026-07-27 時点。公開URL: https://realmake-okegawa.github.io/realmake6/）
#
#  ★ 独自ドメインを取得したら、下の2行をこう書き換えてください。
#      url:     "https://（取得したドメイン）"
#      baseurl: ""
#    リポジトリ直下がサイトのルートになるため、baseurl は空にします。
# ============================================================

url: "https://realmake-okegawa.github.io"
baseurl: "/realmake6"      # ← ドメイン取得時に "" にする

title: "Real Make（リアルメイク）"
description: "桶川市上日出谷南の塗装店。外壁塗装・屋根塗装・防水・コーキング工事を職人直営で承っています。"
lang: ja

# 会社情報（レイアウトから参照されます）
company:
  name: "Real Make"
  kana: "リアルメイク"
  owner: "大川 亮太"
  tel: "090-1434-0189"
  tel_link: "tel:09014340189"
  address: "埼玉県桶川市上日出谷南2-1-19"
  hours: "8:00〜18:00（不定休）"
  founded: "2010"
  line: "https://lin.ee/sEbKJ6O"
  gbp: "https://share.google/U1dqcpyOBwvAJcPx8"

# ブログ記事のURL → /blog/記事名/ の形になります
permalink: /blog/:slug/

# GitHub Pages で使えるプラグイン
plugins:
  - jekyll-sitemap      # sitemap.xml を自動生成
  - jekyll-seo-tag      # title/description/OGPタグを自動生成

# Jekyll の処理から除外するもの（既存ファイルを壊さないため）
exclude:
  - README.md
  - CLAUDE.md
  - takeoff.html
  - "*.zip"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
